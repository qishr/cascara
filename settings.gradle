pluginManagement {
    includeBuild("cascara-gradle-plugins")
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include (":casc-command")
include (":cascara-meta-bom")
include (":cascara-meta-release")

