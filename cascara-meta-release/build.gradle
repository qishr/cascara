// Load parent gradle.properties directly so dependencies and version both resolve
def parentProps = new Properties()
def parentFile = file('../gradle.properties')
if (parentFile.exists()) {
    parentFile.withInputStream { parentProps.load(it) }
}

// Expose variables like cascara_version to project extensions for dependencies
parentProps.each { key, value ->
    ext[key] = value
}

// Set Gradle's core version so JReleaser picks it up automatically
if (parentProps.containsKey('cascara_version')) {
    version = parentProps.getProperty('cascara_version')
}

repositories {
    mavenLocal()
    mavenCentral()
}

