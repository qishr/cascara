def yamlDirName = "$buildDir/jreleaser-yaml"
def yamlDir = file(yamlDirName)

// Parse -Pexclude=mod1,mod2,mod3
def excluded = (project.findProperty("exclude") ?: "")
        .split(",")
        .collect { it.trim() }
        .findAll { it }

// Parse -Pinclude=mod1,mod2,mod3
def included = (project.findProperty("include") ?: "")
        .split(",")
        .collect { it.trim() }
        .findAll { it }

def artifacts = configurations.runtimeClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .findAll { it.moduleVersion.id.group == "io.github.qishr" }
    .findAll { art ->
        def name = art.moduleVersion.id.name
        !excluded.contains(name) && (included.isEmpty() || include.contains(name))
    }

yamlDir.mkdirs()

def artifactEntries = []

// Inject file system operations for safe execution-time copying without calling 'project'
abstract class ReleaseStager extends DefaultTask {
    @Inject
    abstract FileSystemOperations getFs()

    // @InputDirectory
    // abstract DirectoryProperty getBuildDirProperty()

    @Internal
    abstract DirectoryProperty getBuildDirProperty()

    @Input
    abstract Property<String> getProjectVersion()

    @Input
    abstract Property<String> getRootDirPath()

    @Input
    abstract MapProperty<String, String> getProjectProperties()

    @InputFiles
    abstract ConfigurableFileCollection getRuntimeArtifacts()

    @TaskAction
    void stageReleases() {
        def buildDir = buildDirProperty.get().asFile
        def yamlDir = new File(buildDir, "jreleaser-yaml")
        yamlDir.mkdirs()

        def props = projectProperties.get()
        def excluded = (props.get("exclude") ?: "")
                .split(",")
                .collect { it.trim() }
                .findAll { it }

        def included = (props.get("include") ?: "")
                .split(",")
                .collect { it.trim() }
                .findAll { it }

        def artifactEntries = []

        runtimeArtifacts.files.each { file ->
            def fileName = file.name
            // Look for the Maven layout pattern in the path: .../io/github/qishr/{moduleName}/{version}/{fileName}
            def parentDir = file.parentFile
            def version = parentDir.name
            def moduleName = parentDir.parentFile.name

            // Fallback safety check if parent structure doesn't match standard maven coordinates
            if (moduleName == null || moduleName == "build" || moduleName == "staging") {
                return
            }

            // Filter by include/exclude
            if (excluded.contains(moduleName) || (!included.isEmpty() && !included.contains(moduleName))) {
                return
            }

            def moduleDir = new File(buildDir, "staging/io/github/qishr/${moduleName}/${version}")

            fs.copy {
                from file
                into moduleDir
            }

            artifactEntries += "    - path: ${moduleDir}/${fileName}"
            println "Staged ${moduleName} (${version}) -> ${fileName}"
        }

        // 2. ALWAYS stage the BOM POM using the passed rootDir path
        def rootDirFile = new File(rootDirPath.get())
        def bomPom = rootDirFile.parentFile.toPath()
            .resolve("cascara-meta-build/cascara-meta-bom/build/publications/mavenBom/pom-default.xml")
            .toFile()

        if (bomPom.exists()) {
            // def bomProperties = new Properties()
            // rootDirFile.parentFile.toPath()
            //     .resolve("cascara-meta-build/cascara-meta-bom/gradle.properties")
            //     .toFile().withInputStream { bomProperties.load(it) }

            // def bomVersion = bomProperties.getProperty('cascara_version')
            def bomVersion = projectVersion.get()

            def bomDir = new File(buildDir, "staging/io/github/qishr/cascara-meta-bom/${bomVersion}")
            bomDir.mkdirs()

            fs.copy {
                from bomPom
                into bomDir
                rename { "cascara-meta-bom-${bomVersion}.pom" }
            }

            artifactEntries += "    - path: ${bomDir}/cascara-meta-bom-${bomVersion}.pom"

            println "Staged cascara-meta-bom (${bomVersion})"
        } else {
            println "WARNING: BOM POM not found at ${bomPom}"
        }

        // Write ONE YAML file for all modules
        def yaml = """
project:
  version: ${projectVersion.get()}

signing:
  active: always
  pgp:
    armored: true

checksum:
  algorithms:
    - md5
    - sha1
    - sha256
    - sha512

files:
  artifacts:
${artifactEntries.unique().join("\n")}

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: always
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - ${buildDir}/staging
        applyMavenCentralRules: true
"""

        def yamlFile = new File(yamlDir, "release.yml")
        yamlFile.text = yaml

        println "Wrote unified YAML: ${yamlFile}"
    }
}

tasks.register("createReleaseTasks", ReleaseStager) {
    buildDirProperty.set(layout.buildDirectory)
    projectVersion.set(project.version.toString())
    rootDirPath.set(project.rootDir.absolutePath)

    Map<String, String> propMap = [:]
    if (project.hasProperty("exclude")) propMap.put("exclude", project.property("exclude").toString())
    if (project.hasProperty("include")) propMap.put("include", project.property("include").toString())
    projectProperties.set(propMap)

    runtimeArtifacts.from(configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { art ->
        art.moduleVersion.id.group == "io.github.qishr"
    }.collect { art ->
        def originDir = art.file.parentFile
        def base = art.file.name.replace(".jar", "")
        [
            art.file,
            new File(originDir, "${base}.pom"),
            new File(originDir, "${base}-sources.jar"),
            new File(originDir, "${base}-javadoc.jar")
        ]
    }.flatten().findAll { it.exists() })
}


tasks.register("releaseAll", Exec) {
    dependsOn "createReleaseTasks"
    // commandLine "jreleaser", "release", "--git-root-search", "--dry-run", "--basedir", rootProject.projectDir, "--config-file", "$yamlDirName/release.yml"
    commandLine "jreleaser", "release", "--git-root-search", "--basedir", rootProject.projectDir, "--config-file", "$yamlDirName/release.yml"
}
