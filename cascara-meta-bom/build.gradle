plugins {
    id("java-platform")
    id("maven-publish")
    id("signing")
}


javaPlatform {
    allowDependencies()
}


dependencies {
    constraints {
        api 'org.junit.jupiter:junit-jupiter-api:5.13.4'
        api 'org.junit.jupiter:junit-jupiter-params:5.13.4'
        api 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
        api 'org.mockito:mockito-core:5.18.0'
        api 'org.mockito:mockito-junit-jupiter:5.18.0'
        api 'org.junit.platform:junit-platform-launcher'

        api 'org.testfx:testfx-core:4.0.18'
        api 'org.testfx:testfx-junit5:4.0.18'
        api 'org.openjfx:javafx-controls:17.0.6'

        api "io.github.qishr:cascara-common:1.1.13"
        api "io.github.qishr:cascara-common-io:0.10.0"
        api "io.github.qishr:cascara-format-vsix:0.10.0"
        api "io.github.qishr:cascara-lang-css:0.1.0"
        api "io.github.qishr:cascara-lang-ct:0.10.0"
        api "io.github.qishr:cascara-lang-java:0.1.0"
        api "io.github.qishr:cascara-lang-json:0.10.0"
        api "io.github.qishr:cascara-lang-json-simd:0.1.0"
        api "io.github.qishr:cascara-lang-jsonpath:0.1.0"
        api "io.github.qishr:cascara-lang-markdown:0.1.0"
        api "io.github.qishr:cascara-lang-xml:0.10.0"
        api "io.github.qishr:cascara-lang-yaml:0.10.0"
        api 'io.github.qishr:cascara-macos-files:1.1.1'
        api 'io.github.qishr:cascara-macos-menus:0.2.0'
        api "io.github.qishr:cascara-module-core:0.1.0"
        api "io.github.qishr:cascara-schema:0.10.0"
        api "io.github.qishr:cascara-ui:0.10.0"

        // DO NOT inlcude JNA here, it will break things.
        // Include it with its specific version in build files that need it.
    }
}


publishing {
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform
            pom {
                name.set("Cascara Meta BOM")
                description.set("Bill of Materials for Cascara modules")
                url.set("https://github.com/qishr/cascara")
                licenses {
                    license {
                        name.set("MIT License")
                        url.set("https://opensource.org/licenses/MIT")
                    }
                }

                scm {
                    url.set("https://github.com/qishr/cascara")
                }

                developers {
                    developer {
                        name.set("Sandy")
                    }
                }
            }
        }
    }
}


signing {
    sign(publishing.publications["mavenBom"])
}
