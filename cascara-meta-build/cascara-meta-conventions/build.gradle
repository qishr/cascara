plugins {
    id "groovy"
    id "java-gradle-plugin"
    id "com.gradle.plugin-publish" version "1.2.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

gradlePlugin {
    website = "https://qishr.github.io/cascara/getting-started/building-from-source"
    vcsUrl = "https://github.com/qishr/cascara"
    plugins {
        sharedConventions {
            id = "io.github.qishr.cascara.conventions"
            implementationClass = "SharedConventionsPlugin"
            displayName = "Cascara Shared Conventions"
            description = "Shared Gradle conventions for Cascara library and app modules"
            tags = ["cascara", "cascara-meta", "test-coverage", "test-logging", "jar-manifest", "configuration"]
        }
    }
}