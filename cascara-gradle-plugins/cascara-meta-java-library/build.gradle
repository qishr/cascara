plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id("com.gradle.plugin-publish") version "1.2.1"
}

dependencies {
    implementation project(':cascara-meta-conventions')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

gradlePlugin {
    website = "https://qishr.github.io/cascara/building"
    vcsUrl = "https://github.com/qishr/cascara"
    plugins {
        javaLibraryConventions {
            id = "io.github.qishr.cascara-meta.java-library"
            implementationClass = "JavaLibraryConventionsPlugin"
            displayName = "Cascara Java Library Conventions"
            description = "Shared Java Library conventions for Cascara modules"
            tags = ["cascara", "cascara-meta", "configuration"]
        }
    }
}