plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id("com.gradle.plugin-publish") version "1.2.1"
}


group = rootProject.group
version = "0.1.0"


dependencies {
    implementation project(":cascara-meta-conventions")
}


repositories {
    mavenCentral()
}


gradlePlugin {
    website = "https://github.com/qishr/cascara-build-logic"
    vcsUrl = "https://github.com/qishr/cascara-build-logic"
    plugins {
        javaLibraryConventions {
            id = "io.github.qishr.cascara-meta.java-app"
            implementationClass = "JavaAppConventionsPlugin"
            displayName = "Cascara Java App Conventions"
            description = "Shared Java App conventions for Cascara projects"
            tags = ["java-setup", "api-configuration", "test-setup", "jar-manifest", "toolchain-configuration"]
        }
    }
}

